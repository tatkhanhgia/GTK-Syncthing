; GTK-Syncthing - cau hinh chung (Windows + macOS)
; Lan dau: copy thanh config.ini (script tu tao neu thieu)
; Device ID: http://127.0.0.1:8384 -> Action -> Show ID

[local]
; Ten may (de trong = lay tu he thong)
machine_name=
; IP Tailscale cua may nay (de trong hoac CHANGE-ME = dien sau)
tailscale_ip=CHANGE-ME
; Thu muc dong bo. De trong = mac dinh ~/Documents/Sync (ca Win va Mac)
sync_folder=

[syncthing]
folder_id=documents-sync
folder_label=Documents Sync
port=8384

; Peer = may khac trong mang sync. Them [peer.3], [peer.4] ... khi can.
[peer.1]
name=May khac (vi du)
tailscale_ip=CHANGE-ME
device_id=

[peer.2]
name=May thu 3 (placeholder)
tailscale_ip=CHANGE-ME
device_id=
