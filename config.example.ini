; GTK-Syncthing - shared config (Windows + macOS)
; First run: copy to config.ini (script creates it automatically if missing)
; Device ID: http://127.0.0.1:8384 -> Action -> Show ID

[local]
; Machine name (leave blank = use system name)
machine_name=
; Tailscale IP (auto-filled on install if blank or CHANGE-ME)
tailscale_ip=CHANGE-ME
; This machine's Syncthing Device ID (auto-filled after install)
device_id=
; Sync folder. Leave blank = default ~/Documents/Sync (Win and Mac)
sync_folder=

[syncthing]
folder_id=documents-sync
folder_label=Documents Sync
port=8384

; Peers = other machines. Copy the same config.ini to every machine; run Install on each.
; Wizard is skipped when device_id is filled below. Re-run Install after editing this file.
[peer.1]
name=Other machine (example)
tailscale_ip=CHANGE-ME
device_id=

[peer.2]
name=Third machine (placeholder)
tailscale_ip=CHANGE-ME
device_id=
